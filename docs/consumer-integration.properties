# Exemple local pour une application consommatrice (ne pas committer de secrets réels)
spring.datasource.url=jdbc:postgresql://localhost:5433/auth_app
spring.datasource.username=auth_app
spring.datasource.password=${POSTGRES_APP_PASSWORD}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

spring-auth.crypto.master-key=${SPRING_AUTH_CRYPTO_MASTER_KEY}
spring-auth.web.enabled=true
spring-auth.redis.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring-auth.jpa.migrate=true
